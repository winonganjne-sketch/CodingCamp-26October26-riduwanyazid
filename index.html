<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense & Budget Visualizer</h1>
        </header>

        <!-- Total Balance Section -->
        <section class="balance-section">
            <p class="balance-label">TOTAL PENGELUARAN</p>
            <h2 class="balance-amount" id="totalBalance">Rp 0</h2>
        </section>

        <!-- Add Transaction Form -->
        <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="itemName">Nama Item</label>
                    <input type="text" id="itemName" placeholder="Masukkan nama item" required>
                </div>

                <div class="form-group">
                    <label for="amount">Jumlah (Rp)</label>
                    <input type="number" id="amount" placeholder="Masukkan jumlah" step="1" required>
                </div>

                <div class="form-group">
                    <label for="category">Kategori</label>
                    <select id="category" required>
                        <option value="">Pilih kategori</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Transport">Transport</option>
                        <option value="Hiburan">Hiburan</option>
                    </select>
                </div>

                <div class="form-group custom-category-group" id="customCategoryGroup" style="display: none;">
                    <label for="customCategory">Kategori Custom</label>
                    <input type="text" id="customCategory" placeholder="Masukkan kategori baru">
                </div>

                <button type="submit" class="btn btn-primary">Tambah Transaksi</button>
                <button type="button" class="btn btn-secondary" id="addCustomCategoryBtn">+ Tambah Kategori Custom</button>
            </form>
        </section>

        <!-- Filter and Sort Options -->
        <section class="filter-section">
            <div class="filter-controls">
                <div class="filter-group">
                    <label for="sortBy">Urutkan:</label>
                    <select id="sortBy">
                        <option value="date">Tanggal (Terbaru)</option>
                        <option value="amount-desc">Jumlah (Tertinggi)</option>
                        <option value="amount-asc">Jumlah (Terendah)</option>
                        <option value="category">Kategori</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterCategory">Filter Kategori:</label>
                    <select id="filterCategory">
                        <option value="all">Semua Kategori</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Transport">Transport</option>
                        <option value="Hiburan">Hiburan</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Monthly Summary Toggle -->
        <section class="summary-toggle">
            <button class="btn btn-secondary" id="toggleSummary">Tampilkan Ringkasan Bulanan</button>
        </section>

        <!-- Monthly Summary Section -->
        <section class="monthly-summary" id="monthlySummary" style="display: none;">
            <h2>Ringkasan Bulanan</h2>
            <div id="summaryContent"></div>
        </section>

        <!-- Transaction List -->
        <section class="transaction-section">
            <h2>Riwayat Transaksi</h2>
            <div class="transaction-list" id="transactionList">
                <p class="empty-state">Belum ada transaksi. Tambahkan transaksi pertama Anda!</p>
            </div>
        </section>

        <!-- Chart Section -->
        <section class="chart-section">
            <h2>Distribusi Pengeluaran</h2>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
            <p class="chart-empty" id="chartEmpty">Tambahkan transaksi untuk melihat grafik</p>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
